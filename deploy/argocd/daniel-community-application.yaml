apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: daniel-community-helm
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kakao-Tech-Bootcamp/4-daniel-community-BE.git
    targetRevision: helm-gitops
    path: deploy/helm/daniel-community
    helm:
      releaseName: daniel-community-helm
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default